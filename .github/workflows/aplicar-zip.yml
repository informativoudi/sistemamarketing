name: Aplicar atualização (zip)
on:
  push:
    paths: ['atualizacao*.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          set -e
          shopt -s nullglob
          zips=(atualizacao*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Nenhum zip"; exit 0; fi
          for z in "${zips[@]}"; do
            rm -rf /tmp/z && mkdir /tmp/z
            unzip -o -q "$z" -d /tmp/z
            rm -rf /tmp/z/__MACOSX /tmp/z/.github
            base=/tmp/z
            itens=$(ls -A /tmp/z)
            if [ "$(echo "$itens" | wc -l)" -eq 1 ] && [ -d "/tmp/z/$itens" ] && [ "$itens" != "src" ] && [ "$itens" != "config" ] && [ "$itens" != "assets" ]; then base="/tmp/z/$itens"; fi
            rm -rf "$base/.github"
            cp -a "$base"/. .
            rm -f "$z"
            echo "Aplicado: $z"
          done
      - name: Gravar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplica atualização enviada em zip" || exit 0
          git push
      - name: Atualizar o site
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
